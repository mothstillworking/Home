<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moth Still Working — Coming soon</title>
  <meta name="description" content="Moth Still Working: games coming soon.">
  <meta name="theme-color" content="#0d0b1a">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      /* Same colour as the GIF's background, so the animation blends into the page at any size. */
      background: #0d0b1a;
      color: #ffd26e;
      display: flex;
      flex-direction: column;
      font-family: "Courier New", Courier, monospace;
    }
    h1 {
      margin: 0;
      padding: clamp(16px, 5vh, 48px) 16px clamp(8px, 2vh, 16px);
      text-align: center;
      font-size: clamp(28px, 8vw, 80px);
      font-weight: bold;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(255, 170, 70, 0.55);
    }
    .scene { flex: 1; min-height: 0; }
    .scene img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;        /* whole animation always visible, centred */
      image-rendering: pixelated; /* keep the pixel art sharp when scaled up */
    }
  </style>
</head>
<body>
  <h1>Coming soon</h1>
  <main class="scene">
    <img src="moth.gif" alt="A pixel-art moth circling a glowing light bulb and bumping into it">
  </main>
</body>
</html>
